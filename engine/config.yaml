data:
  input_json: monitor_outputs_v2.json

ai:
  model: gemini

# Diretórios para diferentes componentes do sistema
paths:
  models_dir: ai-engine/model-pipeline/models
  output_dir: ai-engine/data/output
  log_dir: ai-engine/logs

logging:
  level: DEBUG
  file: ai_engine.log

api-key:
  google: KEY_VALUE

monitor:
  host: 0.0.0.0
  port: 8082
  route: metrics

actuator:
  host: 0.0.0.0
  port: 8084
  route: apply