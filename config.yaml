data:
  input_json: monitor_outputs.json

ai:
  selected_model: gemini           # Selected model to be used 
  multi_agent: false               # Whether to use multi-agent or not
  scheduler_interval: 300          # Number of seconds between scheduler runs
  timestamp_lookback_seconds: 600  # Number of seconds to look back for metrics
  workloads_shard_size: 20         # Number of workloads to be processed in parallel
  fetch_metrics_immediately: false # Whether to fetch metrics immediately or wait for the scheduler

  models:
    gemini:
      model_name: google/gemini-2.0-flash-001
      provider: google
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    llama:
      model_name: llama-3.1-8b-instant
      provider: groq
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    claude:
      model_name: claude-3.5-sonnet-20240620
      provider: anthropic
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    gpt-4o:
      model_name: openai/gpt-4o
      provider: openai
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000

paths:
  output_dir: ai-engine/data/output
  log_dir: ai-engine/logs

logging:
  level: DEBUG
  file: ai_engine.log

monitor:
  host: 0.0.0.0
  port: 8082
  interval: 600
  route: metrics

actuator:
  host: localhost
  port: 8085
  route: apply

server:
  host: 0.0.0.0
  port: 8083
  reload: false