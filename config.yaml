data:
  input_json: monitor_outputs.json

ai:
  selected_model: gemini
  scheduler_interval: 3000
  timestamp_lookback_seconds: 30
  models:
    gemini:
      model_name: gemini-2.0-flash-001
      provider: google
      api_key: ${GOOGLE_API_KEY}
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    llama:
      model_name: llama-3.1-8b-instant
      provider: groq
      api_key: ${GROQ_API_KEY}
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    claude:
      model_name: claude-3.5-sonnet-20240620
      provider: anthropic
      api_key: ${ANTHROPIC_API_KEY}
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000

# Diretórios para diferentes componentes do sistema
paths:
  models_dir: ai-engine/model-pipeline/models
  output_dir: ai-engine/data/output
  log_dir: ai-engine/logs

logging:
  level: DEBUG
  file: ai_engine.log

api-key:
  groq: 
  anthropic: 

monitor:
  host: 0.0.0.0
  port: 8082
  route: metrics

actuator:
  host: 0.0.0.0
  port: 8084
  route: apply

server:
  host: 0.0.0.0
  port: 8083
  route: start/stop/analyze
  reload: false
  