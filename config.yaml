data:
  input_json: monitor_outputs.json

ai:
  mode: multi_agent                 # Agent mode: 'single_agent' or 'multi_agent'
  selected_model: x-ai/grok-4-fast  # Selected model to be used
  scheduler_interval: 300           # Number of seconds between scheduler runs
  timestamp_lookback_seconds: 600   # Number of seconds to look back for metrics
  fetch_metrics_immediately: false   # Whether to fetch metrics immediately or wait for the scheduler

  # Single Agent Configuration
  single_agent:
    selected_prompt: single_agent_v1
    provider: openrouter
    generation_config:
      temperature: 0.1
      max_output_tokens: 18000

  # Multi-Agent Configuration
  multi_agent:
    selected_prompt: multi_agent
    provider: openrouter
    generation_config:
      temperature: 0.1
      max_output_tokens: 18000
    # Vote system:
    agents:
      cpu_checker:
        enabled: true
        weight: 1.0
      memory_checker:
        enabled: true
        weight: 1.0
      pending_checker:
        enabled: true
        weight: 1.5

  # Legacy default_config for backward compatibility
  default_config:
    provider: openrouter
    generation_config:
      temperature: 0.1
      max_output_tokens: 18000

  models:
    gemini:
      model_name: google/gemini-2.0-flash-001
      provider: google
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    nemotron:
      model_name: nvidia/nemotron-nano-9b-v2
      provider: nvidia
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    claude:
      model_name: anthropic/claude-3.5-sonnet
      provider: anthropic
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    gpt-4o:
      model_name: openai/gpt-4o
      provider: openai
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
        
  cluster_selection: # Configuration for selecting clusters to analyze
    listed_clusters: [] # List of specific cluster labels to include. Empty means all clusters.

recommendation_history:
  enabled: false                    # Toggle feature on/off
  lookback_count: 3                 # Number of past history batches to consider
  mongodb:
    host: "localhost"               # MongoDB host address
    port: 27017                     # MongoDB port
    database: "ai_engine"           # MongoDB database name
    collection: "recommendation_history"  # MongoDB collection name

paths:
  output_dir: ai-engine/data/output
  log_dir: ai-engine/logs

logging:
  level: DEBUG
  file: ai_engine.log

monitor:
  host: 0.0.0.0
  port: 8082
  interval: 600
  route: metrics

actuator:
  host: 0.0.0.0
  port: 8084
  route: apply

server:
  host: 0.0.0.0
  port: 8083
  reload: false

