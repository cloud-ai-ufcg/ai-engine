data:
  input_json: monitor_outputs.json

ai:
  mode: multi_agent               # Agent mode: 'single_agent' or 'multi_agent'
  selected_model: openai/gpt-4.1 # Selected model to be used 
  scheduler_interval: 300          # Number of seconds between scheduler runs
  timestamp_lookback_seconds: 600  # Number of seconds to look back for metrics
  workloads_shard_size: 200         # Number of workloads to be processed in parallel
  fetch_metrics_immediately: true  # Whether to fetch metrics immediately or wait for the scheduler

  # Single Agent Configuration
  single_agent:
    selected_prompt: single_agent_v1  # Available: single_agent_v1, single_agent_v2
    provider: openrouter
    generation_config:
      temperature: 0.1
      max_output_tokens: 12000

  # Multi-Agent Configuration
  multi_agent:
    selected_prompt: multi_agent
    provider: openrouter
    generation_config:
      temperature: 0.1
      max_output_tokens: 18000
    agents:
      cpu_checker:
        enabled: true
        weight: 1.0
      memory_checker:
        enabled: true
        weight: 1.0
      pending_checker:
        enabled: true
        weight: 1.5 

  # Legacy default_config for backward compatibility
  default_config:
    provider: openrouter
    generation_config:
      temperature: 0.1
      max_output_tokens: 12000

  models:
    gemini:
      model_name: google/gemini-2.0-flash-001
      provider: google
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    llama:
      model_name: nvidia/nemotron-nano-9b-v2
      provider: nvidia
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    claude:
      model_name: anthropic/claude-3.5-sonnet
      provider: anthropic
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    gpt-4o:
      model_name: openai/gpt-4o
      provider: openai
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000

paths:
  output_dir: ai-engine/data/output
  log_dir: ai-engine/logs

logging:
  level: DEBUG
  file: ai_engine.log

monitor:
  host: 0.0.0.0
  port: 8082
  interval: 600
  route: metrics

actuator:
  host: 0.0.0.0
  port: 8084
  route: apply

server:
  host: 0.0.0.0
  port: 8083
  reload: false
