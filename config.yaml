data:
  input_json: monitor_outputs.json

ai:
  selected_model: nvidia/nemotron-nano-9b-v2           # Selected model to be used 
  multi_agent: false               # Whether to use multi-agent or not
  scheduler_interval: 300          # Number of seconds between scheduler runs
  timestamp_lookback_seconds: 600  # Number of seconds to look back for metrics
  workloads_shard_size: 20         # Number of workloads to be processed in parallel
  fetch_metrics_immediately: true # Whether to fetch metrics immediately or wait for the scheduler

  default_config:
    provider: openrouter
    generation_config:
      temperature: 0.1
      max_output_tokens: 12000
      system_prompt: "You are an expert Kubernetes workload migration advisor. Analyze the provided workloads through temporal metrics and make migration decisions."
      rules:
        - "Cluster load must not exceed 80% of the cluster capacity."
        - "Pending workloads must not exceed 40% of total workloads."
        - "Provide specific recommendations for each workload."
        - "Provide a summary of the recommendations."

  models:
    gemini:
      model_name: google/gemini-2.0-flash-001
      provider: google
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    llama:
      model_name: llama-3.1-8b-instant
      provider: groq
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    claude:
      model_name: claude-3.5-sonnet-20240620
      provider: anthropic
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    gpt-4o:
      model_name: openai/gpt-4o
      provider: openai
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000

paths:
  output_dir: ai-engine/data/output
  log_dir: ai-engine/logs

logging:
  level: DEBUG
  file: ai_engine.log

monitor:
  host: 0.0.0.0
  port: 8082
  interval: 600
  route: metrics

actuator:
  host: 0.0.0.0
  port: 8084
  route: apply

server:
  host: 0.0.0.0
  port: 8083
  reload: false
